{% extends 'base.html' %}
{% block conteudo %}
<h2>Logs de Auditoria</h2>
<div style="margin-bottom: 20px;">
    <form action="/limpar_logs" method="POST" style="display:inline;" onsubmit="return confirmarAcao('Tem certeza que deseja limpar todos os registros de auditoria?')">
        <button type="submit" class="btn btn-del">Limpar Logs</button>
    </form>
</div>

{% if logs %}
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Descri&#231;&#227;o</th>
            <th>A&#231;&#227;o</th>
            <th>Respons&#225;vel</th>
            <th>Data/Hora</th>
        </tr>
    </thead>
    <tbody>
        {% for l in logs %}
        <tr>
            <td>{{ l[0] }}</td>
            <td>{{ l[1] }}</td>
            <td>
                <span class="log-action
                    {%- if 'CADASTRO' in l[2] %} log-cadastro
                    {%- elif 'ATUALIZOU' in l[2] %} log-atualizou
                    {%- elif 'CRIOU' in l[2] %} log-cadastro
                    {%- elif 'EXCLUIU' in l[2] %} log-desligou
                    {%- elif 'DESLIGOU' in l[2] %} log-desligou
                    {%- elif 'PUBLICOU' in l[2] %} log-atualizou
                    {%- elif 'EXPORTOU' in l[2] %} log-atualizou
                    {%- else %} log-atualizou{% endif %}">
                    {{ l[2] }}
                </span>
            </td>
            <td>{{ l[3] }}</td>
            <td>{{ l[4] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="empty-state">Nenhum registro de auditoria encontrado.</p>
{% endif %}
{% endblock %}
