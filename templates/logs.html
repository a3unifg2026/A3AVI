<!DOCTYPE html>
<html>
<link rel="stylesheet" href="/static/style.css">
    <title>Logs</title>
</head>
<body>
    <h2>Logs</h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Funcionário</th>
            <th>Ação</th>
            <th>Responsável</th>
            <th>Data</th>
        </tr>
        {% for l in logs %}
        <tr>
            <td>{{ l[0] }}</td>
            <td>{{ l[1] }}</td>
            <td>{{ l[2] }}</td>
            <td>{{ l[3] }}</td>
            <td>{{ l[4] }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/limpar_logs">
        <button>Limpar Logs</button>
    </a>
    <br><br>
    <a href="/home">Voltar</a>
</body>
</html>
