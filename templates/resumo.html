{% extends 'base.html' %}
{% block conteudo %}
<h2>Resumo do Sistema</h2>
<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-number">{{ total }}</div>
        <div class="stat-label">Total de Funcion&#225;rios</div>
    </div>
    <div class="stat-card">
        <div class="stat-number" style="color: var(--success);">{{ ativos }}</div>
        <div class="stat-label">Ativos</div>
    </div>
    <div class="stat-card">
        <div class="stat-number" style="color: var(--danger);">{{ desligados }}</div>
        <div class="stat-label">Desligados</div>
    </div>
</div>
{% endblock %}
