{% extends 'base.html' %}
{% block conteudo %}
<h2>Editar Funcion&#225;rio #{{ funcionario[0] }}</h2>
<form action="/editar/{{ funcionario[0] }}" method="POST" style="max-width: 520px;" id="formEdicao">
    <div class="form-group">
        <label>Nome Completo:</label>
        <input type="text" name="nome" value="{{ funcionario[1] }}" required minlength="3">
    </div>
    <div class="form-group">
        <label>Telefone / Contato:</label>
        <input type="tel" name="contato" value="{{ funcionario[2] }}" required placeholder="(00) 00000-0000" maxlength="15">
    </div>
    <div class="form-group">
        <label>Setor:</label>
        <input type="text" name="setor" value="{{ funcionario[3] }}" required>
    </div>
    <div class="form-group">
        <label>E-mail Corporativo:</label>
        <input type="email" name="email" value="{{ funcionario[4] }}" required>
    </div>
    <div class="form-group">
        <label>Cargo:</label>
        <input type="text" name="cargo" value="{{ funcionario[5] }}" required>
    </div>
    <div class="form-group">
        <label>Sal&#225;rio (R$):</label>
        <input type="text" name="salario" value="{{ funcionario[6] }}" required inputmode="decimal">
    </div>
    <button type="submit" class="btn btn-primary">Salvar Altera&#231;&#245;es</button>
    <a href="/listar" class="btn btn-secondary" style="margin-left: 10px;">Cancelar</a>
</form>
{% endblock %}
