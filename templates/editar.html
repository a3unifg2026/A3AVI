{% extends 'base.html' %}
{% block conteudo %}
<h2>✏️ Editar Registro do Funcionário #{{ funcionario[0] }}</h2>
<div class="form-container" style="max-width: 500px;">
    <form action="/editar/{{ funcionario[0] }}" method="POST">
        <label>Nome:</label><br>
        <input type="text" name="nome" value="{{ funcionario[1] }}" required><br>
        <label>Contato:</label><br>
        <input type="text" name="contato" value="{{ funcionario[2] }}" required><br>
        <label>Setor:</label><br>
        <input type="text" name="setor" value="{{ funcionario[3] }}" required><br>
        <label>E-mail:</label><br>
        <input type="email" name="email" value="{{ funcionario[4] }}" required><br>
        <label>Cargo:</label><br>
        <input type="text" name="cargo" value="{{ funcionario[5] }}" required><br>
        <label>Salário:</label><br>
        <input type="number" step="0.01" name="salario" value="{{ funcionario[6] }}" required><br><br>
        <input type="submit" value="Salvar Alterações" style="background-color: green;">
        <a href="/listar" style="margin-left: 15px; color: black;">Cancelar</a>
    </form>
</div>
{% endblock %}
