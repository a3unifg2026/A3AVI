{% extends 'base.html' %}
{% block conteudo %}
<h2>Quadro de Avisos</h2>
<form action="/avisos" method="POST" style="max-width: 520px; margin-bottom: 28px;">
    <div class="form-group">
        <label>T&#237;tulo do Aviso:</label>
        <input type="text" name="titulo" required placeholder="Ex: Comunicado importante">
    </div>
    <div class="form-group">
        <label>Mensagem:</label>
        <textarea name="mensagem" rows="3" required placeholder="Descreva o aviso..."></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Publicar Aviso</button>
</form>

{% for a in avisos %}
<div class="aviso-card">
    <h4>{{ a[1] }}</h4>
    <p>{{ a[2] }}</p>
    <div class="aviso-meta">Publicado por <strong>{{ a[3] }}</strong> em {{ a[4] }}</div>
</div>
{% endfor %}

{% if not avisos %}
<p class="empty-state">Nenhum aviso publicado.</p>
{% endif %}
{% endblock %}
