{% extends 'base.html' %}
{% block conteudo %}
<h2>Gerenciar Setores</h2>
<form action="/cadastrar_setor" method="POST" class="search-bar" style="margin-bottom: 24px;">
    <input type="text" name="nome" placeholder="Nome do novo setor..." required>
    <button type="submit">Adicionar Setor</button>
</form>
<table>
    <thead>
        <tr>
            <th>Nome do Setor</th>
            <th>A&#231;&#245;es</th>
        </tr>
    </thead>
    <tbody>
        {% for s in setores %}
        <tr>
            <td>{{ s[0] }}</td>
            <td>
                <form action="/excluir_setor/{{ s[0] }}" method="POST" style="display:inline;" onsubmit="return confirmarAcao('Deseja excluir o setor {{ s[0] }}?')">
                    <button type="submit" class="btn btn-del">Excluir</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% if not setores %}
<p class="empty-state">Nenhum setor cadastrado.</p>
{% endif %}
{% endblock %}
