<!DOCTYPE html>
<html>
<head>
    <title>Funcionários</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="titulo-box">
        <h3>Lista de Funcionários</h3>
        <a href="/cadastrar"><button>Novo</button></a>
    </div>

    <div class="box">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Setor</th>
                    <th>Cargo</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            {% for f in funcionarios %}
                <tr>
                    <td>{{ f[0] }}</td>
                    <td>{{ f[1] }}</td>
                    <td>{{ f[3] }}</td>
                    <td>{{ f[5] }}</td>
                    <td>
                        <span class="badge {{ f[7]|lower }}">{{ f[7] }}</span>
                    </td>
                    <td class="acoes">
                        <a href="/editar/{{ f[0] }}"><button class="editar">Editar</button></a>
                        <a href="/desligar/{{ f[0] }}"><button class="excluir">Desligar</button></a>
                        <a href="/deletar/{{ f[0] }}"><button class="excluir">Deletar</button></a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
