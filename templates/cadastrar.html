<!DOCTYPE html>
<html>
<link rel="stylesheet" href="/static/style.css">
    <title>Cadastrar</title>
</head>
<body>
    <h2>Cadastrar Funcionário</h2>
    <form method="POST">
        <input type="text"
        name="nome"
        placeholder="Nome">
        <br><br>
        <input type="text"
        name="contato"
        placeholder="Contato">
        <br><br>
        <input type="text"
        name="setor"
        placeholder="Setor">
        <br><br>
        <input type="email"
        name="email"
        placeholder="Email">
        <br><br>
        <input type="text"
        name="cargo"
        placeholder="Cargo">
        <br><br>
        <input type="number"
        name="salario"
        placeholder="Salário">
        <br><br>
        <button type="submit">
            Cadastrar
        </button>
    </form>
    <br>
    <a href="/home">Voltar</a>
</body>
</html>
